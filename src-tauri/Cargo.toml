[package]
name = "jlu-oa-notifier"
version = "0.2.0"
edition = "2021"
description = "吉林大学校内通知查看客户端"

[lib]
name = "jlu_oa_notifier_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
oa-core = { path = "../oa-core" }
